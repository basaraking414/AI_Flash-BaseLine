# general settings
name: R0C_input_recon_v0
model_type: AIFlashModel
scale: 1
num_gpu: 1  # 设为你的GPU数量
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_MaskedImage
    # 训练路径
    dataroot_gt: datasets/train_550/gt
    dataroot_lq: datasets/train_550/input
    dataroot_mask: datasets/train_550/mask_personmask
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 0
    batch_size_per_gpu: 4

    mini_batch_sizes: [1]             
    iters: [300000]
    gt_size: 256  # 目前输入是768*768大小，如果想要使用原图大小，可以修改成0
    gt_sizes: [256]
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    # 验证集，目前直接使用训练集，有需要请自行修改
    dataroot_gt: datasets/val_50/gt
    dataroot_lq: datasets/val_50/input
    dataroot_mask: datasets/val_50/mask_personmask
    io_backend:
      type: disk

# network structures
network_g:
  type: Restormer_AIFlash_mask_attention  # 使用带 mask attention 的版本，支持 alpha 控制
  inp_channels: 3
  out_channels: 3
  dim: 16 
  num_blocks: [2,2,2,2] 
  num_refinement_blocks: 2
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: BiasFree
  dual_pixel_task: False

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 300000
  warmup_iter: -1 # no warm up
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [92000, 208000]       
    restart_weights: [1,1]
    eta_mins: [0.0003,1e-5]
  
  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  
  # losses
  pixel_opt:
    type: CharbonnierLoss_mask
    loss_weight: 2
    reduction: mean
    eps: !!float 1e-3

  # R0+C 核心：关闭 alpha 采样，固定 alpha=1.0
  alpha_sampling: false

  # R0+C 核心：输入重建损失 (I_low ≈ R × E)
  input_recon_opt:
    type: CharbonnierLoss
    loss_weight: 5.0
    reduction: mean
    eps: !!float 1e-3

  # 环境光平滑损失：Total Variation，约束 spatial env_light 低频
  smooth_opt:
    type: TVSmoothLoss
    loss_weight: 0.1

  luminance_opt:
    type: FaceLabLoss
    loss_weight: 1
    lambda_l: 1.5
    lambda_ab: 1.0

  grad_opt:
    type: GradientLoss
    loss_weight: 0.2

  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv3_4': 1.0
      'conv4_4': 1.0
    vgg_type: vgg19
    use_input_norm: true
    range_norm: false
    loss_weight: 0.001

# validation settings
val:
  window_size: 8
  val_freq: !!float 5e3 # 每 5000 次迭代验证一次
  save_img: true        # 开启保存图片 (代码里已限制只存前10张)
  rgb2bgr: true
  use_image: false
  max_minibatch: 8

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    deltaE:
      type: calculate_deltaE

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true   # 开启 TensorBoard
  wandb:
    project: ~ # 设置 WandB 项目名称
    resume_id: ~


# dist training settings
dist_params:
  backend: nccl
  port: 29500
