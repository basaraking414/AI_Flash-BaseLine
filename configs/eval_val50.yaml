# ============================================================
# 评测配置：用发布的 best_Restormer_LIDM.pth 在 val_50 上复算论文 Table I 的「Ours」行
#   用法：python -m basicsr.test -opt configs/eval_val50.yaml
#   论文报告值（val_50）：PSNR 31.35 / ΔE 2.77 / SSIM 0.968
#   本仓库实测值：        PSNR 31.3518 / ΔE 2.7683 / SSIM 0.9676（RTX 4060 Laptop, 50 张全分辨率）
# 指标口径与论文一致：crop_border=0、非 Y 通道、ΔE 在**人像掩码内**按 CIE76 平均（use_image: false）
# ============================================================

name: eval_Restormer_LIDM_val50
model_type: AIFlashModel
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  val:
    name: ValSet50
    type: Dataset_PairedImage
    dataroot_gt: datasets/val_50/gt
    dataroot_lq: datasets/val_50/input
    dataroot_mask: datasets/val_50/mask_personmask
    io_backend:
      type: disk

network_g:
  type: Restormer_AIFlash_mask_attention

path:
  pretrain_network_g: best_model/best_Restormer_LIDM.pth
  strict_load_g: true
  resume_state: ~

# AIFlashModel.__init__ 会读取 train.mixing_augs（test 模式也会读）
train:
  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

val:
  window_size: 8
  save_img: false
  rgb2bgr: true
  use_image: false
  max_minibatch: 8
  max_vis_images: 0
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    deltaE:
      type: calculate_deltaE
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false