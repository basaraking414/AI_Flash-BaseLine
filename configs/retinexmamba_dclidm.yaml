# RetinexMamba + DC-LIDM 配置

name: RetinexMamba_DCLIDM

model_type: AIFlashModel
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  train:
    name: TrainSet
    type: Dataset_MaskedImage
    dataroot_gt: datasets/train_550/gt
    dataroot_lq: datasets/train_550/input
    dataroot_mask: datasets/train_550/mask_personmask
    geometric_augs: true
    filename_tmpl: '{}'
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 0
    batch_size_per_gpu: 4
    mini_batch_sizes: [1]
    iters: [300000]
    gt_size: 256
    gt_sizes: [256]
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: datasets/val_50/gt
    dataroot_lq: datasets/val_50/input
    dataroot_mask: datasets/val_50/mask_personmask
    io_backend:
      type: disk

network_g:
  type: RetinexMamba_AIFlash_LIDM
  in_channels: 3
  out_channels: 3
  n_feat: 32
  stage: 3
  num_blocks: [1, 1, 1]
  d_state: 16
  num_heads: 4

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  total_iter: 200000
  warmup_iter: -1
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [92000, 208000]
    restart_weights: [1, 1]
    eta_mins: [0.0003, 1e-5]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  alpha_sampling: false

  pixel_opt:
    type: CharbonnierLoss_mask
    loss_weight: 2
    reduction: mean
    eps: !!float 1e-3

  input_recon_opt:
    type: CharbonnierLoss
    loss_weight: 5.0
    reduction: mean
    eps: !!float 1e-3

  smooth_opt:
    type: TVSmoothLoss
    loss_weight: 0.1

  luminance_opt:
    type: FaceLabLoss
    loss_weight: 1
    lambda_l: 1.5
    lambda_ab: 1.0

  grad_opt:
    type: GradientLoss
    loss_weight: 0.2

  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv3_4': 1.0
      'conv4_4': 1.0
    vgg_type: vgg19
    use_input_norm: true
    range_norm: false
    loss_weight: 0.001

val:
  window_size: 8
  val_freq: !!float 5e3
  save_img: true
  rgb2bgr: true
  use_image: false
  max_minibatch: 8
  max_vis_images: 10

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    deltaE:
      type: calculate_deltaE
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
