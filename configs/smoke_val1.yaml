# ============================================================
# 冒烟测试配置：1 个样本 + 20 次迭代，用于验证训练/验证链路是否通
# 用途：python basicsr/my_train.py -opt configs/smoke_val1.yaml
# 数据：datasets/val_1/{gt,input,mask_personmask}/001.jpg
# 注意：这不是论文的训练配置（论文用 configs/my_aiflash.yaml，300k iter / 550 张）
# ============================================================

# general settings
name: smoke_val1
model_type: AIFlashModel
scale: 1
num_gpu: 1
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: SmokeTrainSet
    type: Dataset_MaskedImage
    dataroot_gt: datasets/val_1/gt
    dataroot_lq: datasets/val_1/input
    dataroot_mask: datasets/val_1/mask_personmask
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1

    mini_batch_sizes: [1]
    iters: [20]
    gt_size: 256
    gt_sizes: [256]

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: SmokeValSet
    type: Dataset_PairedImage
    dataroot_gt: datasets/val_1/gt
    dataroot_lq: datasets/val_1/input
    dataroot_mask: datasets/val_1/mask_personmask
    io_backend:
      type: disk

# network structures
network_g:
  type: Restormer_AIFlash_mask_attention

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 20
  warmup_iter: -1
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [8, 12]
    restart_weights: [1, 1]
    eta_mins: [0.0003, 0.00001]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  # losses（与 configs/my_aiflash.yaml 完全一致，确保整条损失链路被覆盖）
  pixel_opt:
    type: CharbonnierLoss_mask
    loss_weight: 2
    reduction: mean
    eps: !!float 1e-3

  alpha_sampling: false

  input_recon_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-3

  smooth_opt:
    type: TVSmoothLoss
    loss_weight: 0.1

  luminance_opt:
    type: FaceLabLoss
    loss_weight: 1
    lambda_l: 1.5
    lambda_ab: 1.0

  grad_opt:
    type: GradientLoss
    loss_weight: 0.2

  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv3_4': 1.0
      'conv4_4': 1.0
    vgg_type: vgg19
    use_input_norm: true
    range_norm: false
    loss_weight: 0.001

# validation settings
val:
  window_size: 8
  val_freq: 10
  save_img: true
  rgb2bgr: true
  use_image: false
  max_minibatch: 8
  max_vis_images: 2

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    deltaE:
      type: calculate_deltaE
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 5
  save_checkpoint_freq: 10
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500